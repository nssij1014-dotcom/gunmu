# 근무표 2(v2 폴더)를 안드로이드 APK(gunmu2.apk)로 빌드한다. 기존 근무표 앱(gunmu.apk)과는 앱 ID·이름이 달라 같이 설치할 수 있다.
# main에 올라가면 Releases(apk)에 gunmu2.apk 만 추가·교체하고, 기존 파일과 설명은 건드리지 않는다.
name: APK 2
on:
  push:
    branches: [main]
    paths: ['v2/**', 'apk2/**', '.github/workflows/apk2.yml']
  pull_request:
    paths: ['v2/**', 'apk2/**', '.github/workflows/apk2.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: apk2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 계산 시험
        run: node v2/test/engine.test.js
      - name: 웹 파일 복사, Capacitor 안드로이드 프로젝트 만들기
        working-directory: apk2
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp -r ../v2/index.html ../v2/engine.js ../v2/holidays.js ../v2/manifest.webmanifest ../v2/icons www/
          npx cap add android
          npx cap sync android
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp ../v2/icons/icon-192.png "$d/ic_launcher.png"
            cp ../v2/icons/icon-192.png "$d/ic_launcher_round.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: 서명 키 (같은 키로 서명해야 업데이트 설치가 됨)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore; fi
      - name: APK 빌드
        working-directory: apk2/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gunmu2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk2
          path: gunmu2.apk
      - name: Releases에 올리기 (main에서만)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --latest --title "근무표 앱 (안드로이드·Windows)" --notes "앱 파일"
          gh release upload apk gunmu2.apk --clobber
